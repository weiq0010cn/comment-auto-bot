name: Automated Comment Bot
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  comment:
    name: Add automated issue comment
    runs-on: ubuntu-latest
    steps:
      - name: Add comment based on labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = (context.payload.issue.labels || []).map((label) => String(label && label.name ? label.name : label).toLowerCase());
            let message = 'Thank you for your contribution!';
            if (labels.includes('bug')) {
              message = 'Thank you. We will fix it';
            } else if (labels.includes('feature')) {
              message = 'Thank you, we will consider to include this feature.';
            }
            await github.issues.createComment({
              ...github.context.repo,
              issue_number: context.payload.issue.number,
              body: message
            });
