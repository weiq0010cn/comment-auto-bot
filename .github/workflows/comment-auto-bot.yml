name: Comment Auto Bot

"on":
  issues:
    types: [opened]

jobs:
  comment-on-new-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Add automated comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsForIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const labelNames = labels.map((label) => label.name);
            let message;
            if (labelNames.includes('bug')) {
              message = 'Thank you. We will fix it';
            } else if (labelNames.includes('feature')) {
              message = 'Thank you, we will consider to include this feature.';
            } else {
              message = 'Thank you for your contribution!';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
